version: 2

# Keeps the SHA-pinned GitHub Actions references in .github/workflows/
# current (e.g. Node runtime migrations like node20 -> node24).
#
# Note: templates/github-actions/*.yml are not scanned by Dependabot;
# update those pins manually when adopting a template.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
