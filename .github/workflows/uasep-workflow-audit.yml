name: UASEP Workflow Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit workflow files
        run: |
          echo "UASEP workflow audit started"
          echo "Checking workflow directory structure"
          find .github/workflows -type f -maxdepth 1 -print 2>/dev/null || true
