name: UASEP Auto Repair Trigger

on:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  trigger-repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare repair event
        run: |
          echo "Repair triggered"
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"
