name: UASEP Auto Repair Trigger

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Manual compatibility execution reason
        required: false
        default: manual-recovery

permissions:
  contents: read
  actions: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Report legacy trigger compatibility mode
        run: |
          echo "Legacy auto-repair-trigger is manual-only compatibility mode."
          echo "Reason: ${{ inputs.reason }}"
