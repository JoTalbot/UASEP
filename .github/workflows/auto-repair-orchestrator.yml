name: UASEP Auto Repair Orchestrator

on:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  orchestrate:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create repair context
        run: |
          mkdir -p repair-state
          cat > repair-state/context.txt <<EOF
          workflow=${{ github.event.workflow_run.name }}
          run_id=${{ github.event.workflow_run.id }}
          sha=${{ github.event.workflow_run.head_sha }}
          EOF

      - name: Upload repair context
        uses: actions/upload-artifact@v4
        with:
          name: repair-context
          path: repair-state/context.txt
