name: UASEP Autonomous Validation Loop

# Legacy compatibility workflow.
# Automatic repair routing is owned by UASEP Auto Repair Orchestrator.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Manual validation reason
        required: false
        default: manual-recovery

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Manual validation compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Report compatibility mode
        run: |
          echo "Legacy autonomous validation loop is manual-only compatibility mode."
          echo "Reason: ${{ inputs.reason }}"
          echo "Automatic failure routing: UASEP Auto Repair Orchestrator"
