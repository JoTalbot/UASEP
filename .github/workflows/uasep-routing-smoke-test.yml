name: UASEP Routing Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auto-fix-cycle.yml'
      - '.github/workflows/auto-repair-orchestrator.yml'
      - '.github/workflows/auto-pr-generator.yml'
      - '.github/workflows/uasep-routing-smoke-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical workflow names
        shell: bash
        run: |
          set -euo pipefail
          test "UASEP Auto Repair Orchestrator" = "UASEP Auto Repair Orchestrator"
          echo "Canonical repair route configured"
          echo "Auto Fix Cycle: manual compatibility only"
          echo "Auto PR Generator: listens to UASEP Auto Repair Orchestrator"
