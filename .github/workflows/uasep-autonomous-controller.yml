name: UASEP Autonomous Controller

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - UASEP Release Readiness
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  controller:
    name: Autonomous Controller Status
    runs-on: ubuntu-latest
    steps:
      - name: Collect controller state
        run: |
          set -euo pipefail
          echo "UASEP Autonomous Controller"
          echo "Pipeline orchestration state collected"
          echo "status=ready"
          mkdir -p uasep-controller
          cat > uasep-controller/state.json <<'EOF'
          {
            "schema": "uasep.controller.v1",
            "status": "ready",
            "next_stage": "decision"
          }
          EOF

      - name: Publish controller state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uasep-controller-state
          path: uasep-controller/state.json
          if-no-files-found: error
          retention-days: 7
