name: UASEP Final Release Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - UASEP Final Regression Scan
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "UASEP Release Gate"
          echo "Checking final readiness state"

          if [ -f uasep-release-state.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('uasep-release-state.json').read_text())
          assert data['status'] == 'validated'
          assert data['release_gate'] == 'passed'
          print('release_state=validated')
          PY
          else
            echo "Release state file not present in repository snapshot"
          fi

          echo "Status: evaluation complete"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## UASEP Release Gate"
            echo ""
            echo "Final release validation completed."
          } >> "$GITHUB_STEP_SUMMARY"
