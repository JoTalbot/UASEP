name: UASEP Auto Repair

# Legacy diagnostics compatibility workflow.
# Automatic failure routing is owned by UASEP Auto Repair Orchestrator.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Manual diagnostics reason
        required: false
        default: manual-recovery

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Report legacy diagnostics mode
        run: |
          echo "Legacy auto-repair diagnostics is manual-only compatibility mode."
          echo "Reason: ${{ inputs.reason }}"
