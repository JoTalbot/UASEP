name: UASEP Auto Repair

# Autonomous CI failure analysis helper.
# Captures failed conformance runs and creates diagnostics for repair cycles.

on:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  analyze-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect failure metadata
        run: |
          echo "Workflow: ${{ github.event.workflow_run.name }}" > ci-failure-report.txt
          echo "Run ID: ${{ github.event.workflow_run.id }}" >> ci-failure-report.txt
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> ci-failure-report.txt

      - name: Collect failure logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log > ci-failure-log.txt || true
          echo "Failure log captured" >> ci-failure-report.txt

      - name: Create repair report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "UASEP CI failure requires repair" \
            --body "Automated CI failure detected.\n\nWorkflow: ${{ github.event.workflow_run.name }}\nRun ID: ${{ github.event.workflow_run.id }}\nCommit: ${{ github.event.workflow_run.head_sha }}\n\nFailure logs collected automatically."
