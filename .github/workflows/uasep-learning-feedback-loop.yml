name: UASEP Learning Feedback Loop

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UASEP State Analyzer"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  feedback:
    name: Collect execution feedback
    runs-on: ubuntu-latest
    steps:
      - name: Analyze previous outcome
        run: |
          echo "Collecting repair cycle feedback"
          echo "success/failure/rollback signals prepared"

      - name: Publish feedback summary
        run: |
          echo "## UASEP Learning Feedback" >> "$GITHUB_STEP_SUMMARY"
          echo "Feedback loop completed" >> "$GITHUB_STEP_SUMMARY"
