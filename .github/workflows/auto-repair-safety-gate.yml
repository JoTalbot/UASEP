name: UASEP Auto Repair Safety Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  safety-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect repair state
        run: |
          echo "UASEP repair safety gate active"
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Run: ${{ github.event.workflow_run.id }}"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"

      - name: Validate repair cycle input
        run: |
          echo "Waiting for approved patch execution stage"
