name: UASEP Main Conformance

# Canonical conformance CI: runs the repository-native pytest suite on main
# pushes and pull requests, plus a daily scheduled drift check.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Validate main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input jsonschema pytest pyyaml

      - name: Run conformance suite
        run: python -m pytest tests/conformance kit/uasep -q
