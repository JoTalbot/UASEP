name: UASEP Main Conformance

# Technical maintenance: keep canonical CI execution automatic.
# Runs on main pushes, scheduled drift checks, and manual dispatch.
# Workflow reindex touch: ensure GitHub Actions registers the workflow metadata.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Validate main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input jsonschema pytest pyyaml

      - name: Run conformance suite
        run: python -m pytest tests/conformance -q
