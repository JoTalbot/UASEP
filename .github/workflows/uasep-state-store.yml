name: UASEP State Store

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UASEP Action Executor"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  state-store:
    runs-on: ubuntu-latest
    steps:
      - name: Collect state metadata
        run: |
          echo "UASEP state store initialized"
          echo "run_id=${{ github.run_id }}" >> state.txt
          echo "sha=${{ github.sha }}" >> state.txt

      - name: Upload state snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uasep-state-snapshot
          path: state.txt
