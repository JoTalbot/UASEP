name: UASEP maintenance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Version drift check
        run: |
          python - <<'PY'
          from pathlib import Path
          from runtime.drift import detect_version_drift
          findings = detect_version_drift(Path("."))
          if findings:
              print("DRIFT:", findings)
              raise SystemExit(1)
          print("version drift: ok")
          PY
      - name: Full test suite
        run: python -m pytest -q
      - name: Canonical validate
        run: python tools/validate_uasep.py
