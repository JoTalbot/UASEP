name: UASEP Auto PR Cycle

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Manual compatibility execution reason
        required: false
        default: manual-recovery

permissions:
  contents: read
  pull-requests: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Report legacy compatibility mode
        run: |
          echo "Legacy auto-pr-cycle is manual-only compatibility mode."
          echo "Reason: ${{ inputs.reason }}"
