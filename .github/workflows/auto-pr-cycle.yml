name: UASEP Auto PR Cycle

on:
  workflow_run:
    workflows:
      - UASEP CI Analyzer
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-repair:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare repair cycle
        run: |
          echo "Repair cycle initialized"
          echo "Source run: ${{ github.event.workflow_run.id }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

      - name: Create repair marker
        run: |
          mkdir -p repair
          echo "Automated repair candidate" > repair/status.txt
