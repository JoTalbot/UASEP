name: UASEP Auto Branch Manager

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  prepare-repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare repair cycle
        run: |
          echo "UASEP repair branch preparation"
          echo "run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
