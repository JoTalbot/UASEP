name: UASEP Repair Analyzer

on:
  workflow_run:
    workflows: ["UASEP Repair Context Builder"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create analysis marker
        run: |
          mkdir -p repair-analysis
          cat > repair-analysis/result.json <<'EOF'
          {
            "status": "ready",
            "stage": "analyzer",
            "next": "patch-planner"
          }
          EOF

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: uasep-repair-analysis
          path: repair-analysis/result.json
