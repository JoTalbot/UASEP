name: UASEP Release Gate

# Deliberate pre-release verification. Manual dispatch only: a successful
# run triggers the automated release workflow, which tags the verified
# commit and creates the GitHub release.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uasep-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input jsonschema pytest pyyaml

      - name: Verify release checklist exists
        run: test -f release-readiness/UASEP_RELEASE_CHECKLIST.md

      - name: Verify workflow permissions are explicit
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            grep -q '^permissions:' "$file" || { echo "Missing permissions block: $file"; exit 1; }
          done

      - name: Run conformance suite
        shell: bash
        run: python -m pytest tests/conformance kit/uasep -q

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d .github/workflows
          echo "Verified commit: $GITHUB_SHA"
          echo 'Release gate passed.'
