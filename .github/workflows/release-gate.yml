name: UASEP Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: uasep-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Verify release checklist exists
        run: test -f release-readiness/UASEP_RELEASE_CHECKLIST.md

      - name: Verify workflow permissions are explicit
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            grep -q '^permissions:' "$file" || { echo "Missing permissions block: $file"; exit 1; }
          done

      - name: Run conformance tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests/conformance ]; then
            python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tests/conformance/test_protocol_invariants.py")
          spec = importlib.util.spec_from_file_location("uasep_conformance", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          tests = sorted(name for name in dir(module) if name.startswith("test_"))
          if not tests:
              raise SystemExit("No conformance tests discovered")
          for name in tests:
              getattr(module, name)()
              print(f"PASS {name}")
          print(f"Conformance tests passed: {len(tests)}")
          PY
          else
            echo 'No tests/conformance directory found; structural gates remain enforced.'
          fi

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d .github/workflows
          echo "Verified commit: $GITHUB_SHA"
          echo 'Release gate passed.'
