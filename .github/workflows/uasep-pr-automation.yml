name: UASEP PR Automation

# Manual compatibility workflow.
# Automatic PR routing is owned by UASEP Auto PR Generator.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Manual PR automation reason
        required: false
        default: manual-recovery

permissions:
  contents: read
  pull-requests: write

jobs:
  compatibility:
    name: Manual PR automation compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Report compatibility mode
        run: |
          echo "Legacy UASEP PR Automation is manual-only compatibility mode."
          echo "Reason: ${{ inputs.reason }}"
