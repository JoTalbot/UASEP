name: UASEP Repair State Consumer

on:
  workflow_run:
    workflows:
      - UASEP Repair State Manager
    types:
      - completed

permissions:
  contents: read

jobs:
  consume-state:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report repair state availability
        run: |
          echo "Repair state received"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Commit SHA: ${{ github.event.workflow_run.head_sha }}"
