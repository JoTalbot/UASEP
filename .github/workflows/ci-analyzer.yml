name: UASEP CI Analyzer

on:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  analyze:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect and classify failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log > ci.log || true
          echo "UASEP CI FAILURE ANALYSIS" > analysis.txt
          if grep -qi "dependency\|pip\|package" ci.log; then
            echo "Category: dependency" >> analysis.txt
          elif grep -qi "pytest\|FAILED\|assert" ci.log; then
            echo "Category: test failure" >> analysis.txt
          elif grep -qi "permission\|not allowed\|security" ci.log; then
            echo "Category: security/policy" >> analysis.txt
          else
            echo "Category: unknown" >> analysis.txt
          fi
          cat analysis.txt

      - name: Create analysis issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "UASEP automated failure analysis" \
            --body "Automated classification completed. Check CI logs for repair action."
