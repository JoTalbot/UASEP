name: UASEP Action Executor

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UASEP Decision Engine"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  execute:
    name: Execute decision action
    runs-on: ubuntu-latest
    steps:
      - name: Download decision contract
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: uasep-decision-contract
          path: uasep-decision
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate decision contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test -s uasep-decision/decision.json
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("uasep-decision/decision.json")
          data = json.loads(p.read_text())
          assert data["schema"] == "uasep.decision.v1"
          assert data["status"] == "ready"
          assert data["decision"] in set(data["allowed_actions"])
          assert set(data["allowed_actions"]) <= {"repair", "retry", "stop", "release", "review"}
          print(f"decision={data['decision']}")
          print(f"status={data['status']}")
          PY
          else
            echo "Manual execution: no upstream contract is available."
          fi

      - name: Execute selected action safely
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            decision=$(python -c 'import json; print(json.load(open("uasep-decision/decision.json"))["decision"])')
            echo "Selected action: $decision"
            case "$decision" in
              review)
                echo "Review selected: no mutating action will be performed."
                ;;
              repair|retry|stop|release)
                echo "Action accepted by UASEP execution contract; policy gate remains required before mutation."
                ;;
              *)
                echo "Unsupported action" >&2
                exit 1
                ;;
            esac
          fi

      - name: Write execution result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p uasep-execution
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            decision=$(python -c 'import json; print(json.load(open("uasep-decision/decision.json"))["decision"])')
          else
            decision="manual"
          fi
          cat > uasep-execution/result.json <<EOF
          {
            "schema": "uasep.execution.v1",
            "decision": "$decision",
            "status": "validated",
            "mutation": "not_performed"
          }
          EOF

      - name: Publish execution result
        uses: actions/upload-artifact@v4
        with:
          name: uasep-execution-result
          path: uasep-execution/result.json
          if-no-files-found: error
          retention-days: 7

      - name: Write execution summary
        run: |
          {
            echo "## UASEP Action Executor"
            echo "Status: contract validated"
            echo "Execution mode: policy-gated"
            echo "Mutation: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
