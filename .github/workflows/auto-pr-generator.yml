name: UASEP Auto PR Generator

on:
  workflow_run:
    workflows:
      - UASEP Auto Repair
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare repair cycle
        run: |
          echo "Preparing automated repair PR"
          echo "Source run: ${{ github.event.workflow_run.id }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

      - name: Create repair marker
        run: |
          mkdir -p .uasep
          echo "Automated repair candidate" > .uasep/repair-plan.txt
