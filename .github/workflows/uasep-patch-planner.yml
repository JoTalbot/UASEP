name: UASEP Patch Planner

on:
  workflow_run:
    workflows: ["UASEP Repair Analyzer"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-plan:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Generate patch plan context
        run: |
          mkdir -p repair
          cat > repair/patch-plan.json <<'EOF'
          {
            "stage": "patch-planner",
            "status": "ready",
            "next": "safety-gate"
          }
          EOF

      - name: Upload patch plan
        uses: actions/upload-artifact@v4
        with:
          name: uasep-patch-plan
          path: repair/patch-plan.json
