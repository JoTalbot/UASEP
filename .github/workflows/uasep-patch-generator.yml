name: UASEP Patch Generator

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UASEP Artifact State Sync"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  patch-generator:
    name: Generate remediation patch context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate patch context
        run: |
          echo "UASEP Patch Generator"
          echo "Preparing remediation patch context"
          echo "status=ready" >> "$GITHUB_STEP_SUMMARY"
