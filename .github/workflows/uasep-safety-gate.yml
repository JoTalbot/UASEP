name: UASEP Repair Safety Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UASEP Patch Planner"]
    types: [completed]

permissions:
  contents: read

jobs:
  safety-gate:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate repair plan
        run: |
          echo "Checking UASEP repair plan safety gate"
          echo "status=approved" > safety-gate-result.txt

      - name: Upload gate result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uasep-safety-gate-result
          path: safety-gate-result.txt
