name: UASEP Auto Repair Health Check

on:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  health-check:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect repair health status
        run: |
          echo "UASEP repair pipeline triggered"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"
