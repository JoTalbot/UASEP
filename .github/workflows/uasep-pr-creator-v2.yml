name: UASEP PR Creator v2

on:
  workflow_dispatch:
    inputs:
      repair_branch:
        required: true
        description: Repair branch name
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-context:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare PR creation state
        run: |
          mkdir -p uasep-pr-state
          cat > uasep-pr-state/pr-context.json <<'EOF'
          {
            "stage": "pr-creator",
            "status": "ready"
          }
          EOF
      - name: Upload PR state
        uses: actions/upload-artifact@v4
        with:
          name: uasep-pr-state
          path: uasep-pr-state/pr-context.json
