name: UASEP Repair Orchestrator v2

on:
  workflow_run:
    workflows:
      - UASEP Main Conformance
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  orchestrate:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect repair context
        run: |
          echo "repair pipeline started"
          echo "run=${{ github.event.workflow_run.id }}" >> repair-context.txt
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> repair-context.txt

      - name: Upload repair context
        uses: actions/upload-artifact@v4
        with:
          name: uasep-repair-context
          path: repair-context.txt
