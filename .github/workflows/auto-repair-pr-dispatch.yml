name: UASEP Auto Repair PR Dispatch

on:
  workflow_run:
    workflows:
      - UASEP Auto Repair Trigger
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  dispatch-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare repair PR context
        run: |
          echo "Repair PR dispatch prepared"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"
