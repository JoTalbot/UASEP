name: UASEP Artifact Integrity Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UASEP Action Executor"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  artifact-integrity:
    name: Verify artifact integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Validate artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f uasep-artifact-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('uasep-artifact-manifest.json').read_text())
          assert data['schema']=='uasep.artifact.v1'
          assert data['integrity_gate']=='enabled'
          print('artifact_manifest=validated')
          PY

      - name: Integrity summary
        run: |
          echo "## UASEP Artifact Integrity Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest validation completed." >> "$GITHUB_STEP_SUMMARY"
