name: UASEP Conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  conformance:
    name: Validate UASEP structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Check required UASEP artifacts
        run: |
          test -f AGENTS.md
          test -d .uasep
          test -d .uasep/decisions || true
          test -d .uasep/knowledge || true
          test -d .uasep/tests || true
          echo "UASEP conformance baseline passed"
