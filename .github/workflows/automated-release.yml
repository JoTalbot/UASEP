name: UASEP Automated Release

on:
  workflow_run:
    workflows: ["UASEP Release Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: uasep-automated-release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine release tag from VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION content: '${version}'"; exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Release tag: v${version} (from VERSION)"

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/${{ steps.version.outputs.tag }}" -f "sha=${{ github.event.workflow_run.head_sha }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --target "${{ github.event.workflow_run.head_sha }}" --generate-notes --verify-tag

      - name: Verify immutable tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          expected="${{ github.event.workflow_run.head_sha }}"
          actual=$(git rev-list -n 1 "refs/tags/${tag}")
          if [ "$actual" != "$expected" ]; then
            echo "Tag integrity failure: ${tag} -> ${actual}, expected ${expected}"
            exit 1
          fi
          echo "Tag integrity verified: ${tag} -> ${actual}"

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          expected="${{ github.event.workflow_run.head_sha }}"
          gh api "repos/${{ github.repository }}/releases/tags/${tag}" > release.json
          python3 - <<'PY'
          import json
          data = json.load(open("release.json"))
          assert not data["draft"], "release is still a draft"
          print("release published:", data["html_url"])
          PY
          actual_target=$(python3 -c "import json; print(json.load(open('release.json'))['target_commitish'])")
          if [ "$actual_target" != "$expected" ]; then
            echo "Release target mismatch: ${actual_target} != ${expected}"
            exit 1
          fi
          echo "Release target verified: ${actual_target}"
