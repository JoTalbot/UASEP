name: UASEP Automated Release

on:
  workflow_run:
    workflows: ["UASEP Release Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: uasep-automated-release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine release tag from VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION content: '${version}'"; exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Release tag: v${version} (from VERSION)"

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/${{ steps.version.outputs.tag }}" -f "sha=${{ github.event.workflow_run.head_sha }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --target "${{ github.event.workflow_run.head_sha }}" --generate-notes --verify-tag
