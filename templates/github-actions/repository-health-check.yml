name: UASEP Repository Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Repository audit
        run: |
          echo "UASEP repository health audit"
          test -f README.md
          test -d .github/workflows || true
          echo "Audit completed"
