name: UASEP Repository Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Repository audit
        run: |
          echo "UASEP repository health audit"
          test -f README.md
          test -d .github/workflows || true
          echo "Audit completed"
