name: Standard Release

on:
  workflow_run:
    workflows: ["Standard CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@ca5c0c16c8f10f6e7c7d7b0c1ddc2c5d9b7a3e1f
        with:
          generate_release_notes: true
